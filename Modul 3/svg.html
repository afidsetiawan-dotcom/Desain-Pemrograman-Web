<!DOCTYPE html>
<html lang="id">

<head>
    <title>Halaman Beranda</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="author" content="Afid Setiawan">
    <meta name="nim" content="253307056">
    <meta name="description" content="Website praktikum HTML5 Lanjut">
    <meta name="keywords" content="HTML5, Form, Audio, Video, SVG, Canvas">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        header {
            background-color: #666;
            padding: 30px;
            text-align: center;
            font-size: 35px;
            color: white;
        }

        /* MAIN (UNTUK STICKY FOOTER) */
        main {
            flex: 1;
        }

        /* LAYOUT */
        section {
            display: flex;
            flex-wrap: wrap;
        }

        /* NAVIGATION */
        nav {
            width: 30%;
            background: #ccc;
            padding: 20px;
        }

        nav ul {
            list-style-type: none;
            padding: 0;
        }

        nav ul li {
            margin-bottom: 10px;
        }

        nav ul li a {
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        /* ARTICLE */
        article {
            width: 70%;
            background-color: #f1f1f1;
            padding: 20px;
        }

        /* FOOTER */
        footer {
            background-color: #777;
            padding: 10px;
            text-align: center;
            color: white;
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {

            nav,
            article {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>Judul Website</h2>
    </header>

    <main>
        <section>

            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="gambar.html">Gambar</a></li>
                    <li><a href="event.html">Event</a></li>
                    <li><a href="audio.html">Audio</a></li>
                    <li><a href="video.html">Video</a></li>
                    <li><a href="svg.html">SVG</a></li>
                    <li><a href="canvas.html">Canvas</a></li>
                    <li><a href="pendaftaran.html">Pendaftaran</a></li>
                </ul>
            </nav>

            <article>
                <h1>SVG HTML5</h1>

                <svg width="100" height="100">
                    <circle cx="50" cy="50" r="48" stroke="green" stroke-width="4" fill="yellow" />
                </svg>
                <svg width="100" height="100">
                    <rect width="400" height="100" style="fill:rgb(0,0,255); stroke-width:10; stroke: rgb(0,0,0)" />
                </svg>
                <svg width="400" height="180">
                    <rect x="50" y="20" rx="20" ry="20" width="150" height="150"
                        style="fill:red; stroke: black; stroke-width:5;opacity:0.5" />
                </svg>
                <svg height="220" width="500" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="100,10 150,190 50,190" style="fill:lime;stroke:purple;stroke-width:3" />
                </svg>

                <p>
                    <strong>Kesimpulan:</strong><br>
                    Simple dan menarik, karena kesederhanaannya memikat hati dan mata😍
                </p>
            </article>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Praktikum HTML5 | Afid Setiawan</p>
    </footer>

</body>

</html>
