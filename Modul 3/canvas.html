<!DOCTYPE html>
<html lang="id">

<head>
    <title>Halaman Beranda</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="author" content="Afid Setiawan">
    <meta name="nim" content="253307056">
    <meta name="description" content="Website praktikum HTML5 Lanjut">
    <meta name="keywords" content="HTML5, Form, Audio, Video, SVG, Canvas">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        header {
            background-color: #666;
            padding: 30px;
            text-align: center;
            font-size: 35px;
            color: white;
        }

        /* MAIN (UNTUK STICKY FOOTER) */
        main {
            flex: 1;
        }

        /* LAYOUT */
        section {
            display: flex;
            flex-wrap: wrap;
        }

        /* NAVIGATION */
        nav {
            width: 30%;
            background: #ccc;
            padding: 20px;
        }

        nav ul {
            list-style-type: none;
            padding: 0;
        }

        nav ul li {
            margin-bottom: 10px;
        }

        nav ul li a {
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        /* ARTICLE */
        article {
            width: 70%;
            background-color: #f1f1f1;
            padding: 20px;
        }

        /* FOOTER */
        footer {
            background-color: #777;
            padding: 10px;
            text-align: center;
            color: white;
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {

            nav,
            article {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>Judul Website</h2>
    </header>

    <main>
        <section>

            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="gambar.html">Gambar</a></li>
                    <li><a href="event.html">Event</a></li>
                    <li><a href="audio.html">Audio</a></li>
                    <li><a href="video.html">Video</a></li>
                    <li><a href="svg.html">SVG</a></li>
                    <li><a href="canvas.html">Canvas</a></li>
                    <li><a href="pendaftaran.html">Pendaftaran</a></li>
                </ul>
            </nav>

            <article>
                <h1>CANVAS HTML5</h1>
                <canvas id="myCanvas" width="500" height="300" style="border:1px solid black;"></canvas>
                <button onclick="hapus()">Hapus</button>
                <script>
                    const canvas = document.getElementById("myCanvas");
                    const ctx = canvas.getContext("2d");

                    let gambar = false;

                    // saat mouse ditekan
                    canvas.addEventListener("mousedown", function (e) {
                        gambar = true;
                        ctx.beginPath();
                        ctx.moveTo(e.offsetX, e.offsetY);
                    });

                    // saat mouse digerakkan
                    canvas.addEventListener("mousemove", function (e) {
                        if (gambar) {
                            ctx.lineTo(e.offsetX, e.offsetY);
                            ctx.stroke();
                        }
                    });

                    // saat mouse dilepas
                    canvas.addEventListener("mouseup", function () {
                        gambar = false;
                    });

                    // kalau keluar canvas
                    canvas.addEventListener("mouseleave", function () {
                        gambar = false;
                    });

                    // buat hapus coretan
                    function hapus() {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                    }

                </script>

                <p>
                    <strong>Kesimpulan:</strong><br>
                    Coba coret-coret disini untuk suasana hatimu😁
                </p>
            </article>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Praktikum HTML5 | Afid Setiawan</p>
    </footer>

</body>

</html>
