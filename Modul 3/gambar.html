<!DOCTYPE html>
<html lang="id">

<head>
    <title>Galeri Potret</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="author" content="Afid Setiawan">
    <meta name="nim" content="253307056">
    <meta name="description" content="Website praktikum HTML5 Lanjut">
    <meta name="keywords" content="HTML5, Gallery, Responsive">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        /* HEADER */
        header {
            background-color: #666;
            padding: 30px;
            text-align: center;
            font-size: 35px;
            color: white;
        }

        /* LAYOUT */
        section {
            display: flex;
            flex-wrap: wrap;
        }

        /* NAVIGATION */
        nav {
            width: 25%;
            background: #ccc;
            padding: 20px;
        }

        nav ul {
            list-style-type: none;
            padding: 0;
        }

        nav ul li {
            margin-bottom: 10px;
        }

        nav ul li a {
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        /* ARTICLE */
        article {
            width: 75%;
            padding: 20px;
            background-color: #f1f1f1;
        }

        /* GALLERY FLEXIBLE */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .gallery img {
            width: 100%;
            height: 250px;
            object-fit: contain;
            border-radius: 10px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        img:hover {
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        /* HOVER EFFECT */
        .gallery img:hover {
            transform: scale(1.05);
        }

        /* FOOTER */
        footer {
            background-color: #f6f7f1;
            padding: 15px;
            text-align: center;
            color: white;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            nav {
                width: 100%;
            }

            article {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <!---->
    <header>
        <h4>Galeri Aktor 90s Joey Wong</h4>
    </header>

    <section>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="gambar.html">Gambar</a></li>
                <li><a href="event.html">Event</a></li>
                <li><a href="audio.html">Audio</a></li>
                <li><a href="video.html">Video</a></li>
                <li><a href="svg.html">SVG</a></li>
                <li><a href="canvas.html">Canvas</a></li>
                <li><a href="pendaftaran.html">Pendaftaran</a></li>
            </ul>
        </nav>

        <article>

            <div class="gallery">
                <img src="gambar/gambar1.jpg" alt="Potret 1">
                <img src="gambar/gambar2.jpg" alt="Potret 2">
                <img src="gambar/gambar3.jpg" alt="Potret 3">
                <img src="gambar/gambar4.jpg" alt="Potret 4">
                <img src="gambar/gambar5.jpg" alt="Potret 5">
                <img src="gambar/gambar6.jpg" alt="Potret 6">
            </div>
        </article>

    </section>

    <footer>
        <p>&copy; History Aktor 90s Joey Wong</p>
    </footer>

</body>

</html>
