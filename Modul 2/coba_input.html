</head>

<body>

    <p>--kesimpulan ---</p>

    <br>
    <hr>
    <h3>Uji Coba 3</h3>
    <input type="checkbox" id="vehicle1" name="vehicle1" value="Bike">
    <label for="vehicle1"> I have a bike</label><br>
    <input type="checkbox" id="vehicle2" name="vehicle2" value="Car">
    <label for="vehicle2"> I have a car</label><br>
    <input type="checkbox" id="vehicle3" name="vehicle3" value="Boat">
    <label for="vehicle3"> I have a boat</label><br>

    <br>
    <hr>
    <h3>Uji Coba 4</h3>
    <label for="favcolor">Pilih Warna dengan type="color":</label>
    <input type="color" id="favcolor" name="favcolor"><br>
    <label for="b">Pilih tanggal dengan type="date":</label>
    <input type="date" id="b" name="tanggal"><br>
    <input type="button" onclick="alert('Hello AfidS')" value="Click Me!"></br>
    <p>--kesimpulan ---</p>

    <br>
    <hr>
    <h3>Uji Coba 5</h3>
    <label for="birthdaytime">Input dengan type datetime-local:</label>
    <input type="datetime-local" id="birthdaytime" name="birthdaytime"><br>
    <label for="bdaymonth">Input dengan type month : </label>
    <input type="month" id="bdaymonth" name="bdaymonth"><br>
    <label for="email">Enter your email : </label>
    <input type="email" id="email" name="email"></br>
    <p>--kesimpulan ---</p>

    <br>
    <hr>
    <h3>Uji Coba 6</h3>

    <label for="myfile">Pilih file</label>
    <input type="file" id="myfile" accept="image/*"><br>

    <img id="preview" src="" width="150" style="display:none;">

    <script>
        document.getElementById("myfile").addEventListener("change", function (event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = document.getElementById("preview");
                    img.src = e.target.result;
                    img.style.display = "block";
                }
                reader.readAsDataURL(file);
            }
        });
    </script>
    <p>--kesimpulan ---</p>

    <br>
    <hr>
    <h3>Uji Coba 7</h3>
    <label for="quantity">Quantity (between 1 and 5):</label><br>
    <input type="number" id="quantity" name="quantity" min="1" max="10"></br>
    <label for="vol">Volume (between 0 and 50):</label><br>
    <input type="range" id="vol" name="vol" min="0" max="50"></br>
    <p>--kesimpulan ---</p>

    <br>
    <hr>
    <h3>Uji Coba 8 </h3>
    <label for="homepage">Add your homepage:</label>
    <input type="url" id="homepage" name="homepage"></br>
    <label for="gsearch">Search Google:</label>
    <input type="search" id="gsearch" name="gsearch"></br>
    <label for="ph">Enter your phone number</label><br>
    <input type="tel" id="ph" name="phone" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}"></br>
    <p>--kesimpulan ---</p>

    <br>
    <hr>
    <h3>Uji Coba 9</h3>

    <input type="time" id="appt" name="appt"></br>
    <label for="week">Select a week:</label><br>
    <input type="week" id="week" name="week"><br>
    <p>--kesimpulan ---</p>
</body>

</html>
