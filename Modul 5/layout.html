<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Grid</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .grid-container {
            display: grid;

            grid-template-areas:
                "header header header"
                "menu main right"
                "menu footer footer";

            grid-template-columns: 200px 1fr 200px;
            grid-template-rows: auto 1fr auto;

            gap: 10px;
            padding: 10px;
        }

        .header {
            grid-area: header;
            background: blue;
            padding: 20px;
            text-align: center;
            font-weight: bold;
        }

        .menu {
            grid-area: menu;
            background: red;
            padding: 20px;
            text-align: center;
        }

        .main {
            grid-area: main;
            background: yellow;
            padding: 20px;
            text-align: center;
        }

        .right {
            grid-area: right;
            background: orange;
            padding: 20px;
            text-align: center;
        }

        .footer {
            grid-area: footer;
            background: greenyellow;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="grid-container">
        <div class="header">Header</div>
        <div class="menu">Menu</div>
        <div class="main">Main</div>
        <div class="right">Right</div>
        <div class="footer">Footer</div>
    </div>

</body>

</html>
