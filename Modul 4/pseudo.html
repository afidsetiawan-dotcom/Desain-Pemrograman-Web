<!DOCTYPE html>
<html>

<head>
    <title>Belajar Pseudo-class</title>
    <style>
        /* Sembunyikan paragraf secara default  */
        p {
            display: none;
            background-color: darkgray;
            padding: 20px;
        }

        /* Tampilkan paragraf saat div di-hover  */
        div:hover p {
            display: block;
        }

        /* Tugas tambahan: Link berubah warna  */
        a:link {
            color: blue;
        }

        a:hover {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div>
        Letakkan kursor disini untuk melihat div element.
        <p>Saya adalah element p</p>
    </div>

    <br>
    <a href="#">Contoh Link (Arahkan mouse ke sini)</a>
</body>

</html>
